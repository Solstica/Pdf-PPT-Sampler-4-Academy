[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "academy-sampler"
version = "1.2.3rc1"
description = "Deterministic slide images and evidence-based AI study protocols"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24,<2", "Pillow>=10", "PyYAML>=6"]
[project.optional-dependencies]
windows = ["pywin32>=306; sys_platform == 'win32'"]
test = ["pytest>=8"]
[project.scripts]
academy = "academy_sampler.cli:main"
trans = "academy_sampler.trans:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
academy_sampler = ["assets/**/*", "assets/.gitignore"]
